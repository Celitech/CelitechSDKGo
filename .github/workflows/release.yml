name: Release

# Runs when a merge to main changes the SDK version: creates the tag v<version> and the GitHub release.
# Go has no registry to upload to: the semver git tag is the release, and proxy.golang.org / pkg.go.dev
# pick it up from there. Same flow as the Postman workflow it replaces. Kept out of Fern's regeneration
# by .fernignore.
#
# The version is read from .manifest.json (config.target.sdkVersion, with or without a leading "v"),
# so this file never needs editing for a new version.
on:
  push:
    branches: [main]
    paths:
      - '.manifest.json'
      - 'go.mod'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: pkg
        run: |
          version=$(node -p "require('./.manifest.json').config.target.sdkVersion")
          version="${version#v}"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::config.target.sdkVersion not found in .manifest.json"
            exit 1
          fi
          module=$(awk '/^module / { print $2 }' go.mod)
          # Go requires the module path to end in /vN for major version N >= 2 (v3.x.x -> .../v3).
          major="${version%%.*}"
          if [ "$major" -ge 2 ] && [[ "$module" != */v${major} ]]; then
            echo "::error::Version ${version} needs a module path ending in /v${major}, but go.mod says ${module}"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "module=${module}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional: asks the Go module proxy to fetch the new version now, so it shows up on pkg.go.dev
      # sooner. Without it, the proxy fetches it the first time someone runs `go get`.
      - name: Notify the Go module proxy
        if: steps.release.outputs.created == 'true'
        env:
          MODULE: ${{ steps.pkg.outputs.module }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          curl -sf "https://proxy.golang.org/${MODULE}/@v/${TAG}.info" \
            || echo "::notice::The proxy will pick up ${TAG} on the first go get"
